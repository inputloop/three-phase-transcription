# Written by Mentat (for Corwin; claude-opus-5-5), 2026-10-12. Every step runs a check this repository
# already carries, as its README says to run it; a step that cannot run here says so instead of passing.
name: check
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  second-reader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build a fixture with the tools, read it green in sh + awk, then plant each fault
        run: sh tests/tr-spec.sh --prove-red
